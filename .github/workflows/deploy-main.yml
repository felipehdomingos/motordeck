name: Deploy MotorDeck

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  SERVICE_NAME: motordeck
  REPOSITORY_NAME: motordeck

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::631718646750:role/motordeck-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr
        run: |
          REGISTRY="${{ github.repository_owner }}"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY_NAME:${GITHUB_SHA}"
          # batch-get-image exits 0 even when the tag is missing; describe-images fails with ImageNotFoundException.
          if aws ecr describe-images --repository-name "$REPOSITORY_NAME" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Imagem $IMAGE já existe no ECR; reutilizando a tag imutável."
            echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Do not publish BuildKit provenance/SBOM attestations as a second
          # OCI manifest; ECR push only needs the image manifest permissions.
          docker build --pull --provenance=false --sbom=false -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Discover network and secrets
        id: aws-resources
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          SECRET_ARN="$(aws secretsmanager describe-secret --secret-id "motordeck/$SERVICE_NAME/production" --query ARN --output text)"
          VPC_ID="$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query 'Vpcs[0].VpcId' --output text)"
          SERVICE_SG="$(aws ec2 describe-security-groups --filters Name=vpc-id,Values="$VPC_ID" Name=group-name,Values=motordeck-ecs --query 'SecurityGroups[0].GroupId' --output text)"
          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            echo "Nenhuma VPC default encontrada em $AWS_REGION." >&2
            exit 1
          fi
          if [ -z "$SERVICE_SG" ] || [ "$SERVICE_SG" = "None" ]; then
            echo "Security group motordeck-ecs não encontrado na VPC $VPC_ID." >&2
            exit 1
          fi
          mapfile -t SUBNETS < <(aws ec2 describe-subnets --filters Name=vpc-id,Values="$VPC_ID" Name=map-public-ip-on-launch,Values=true --query 'Subnets | sort_by(@, &AvailabilityZone)[:2].SubnetId' --output text | tr '\t' '\n' | sed '/^None$/d;/^$/d')
          if [ "${#SUBNETS[@]}" -lt 2 ]; then
            echo "A VPC $VPC_ID precisa de pelo menos duas subnets públicas." >&2
            exit 1
          fi
          echo "secret_arn=$SECRET_ARN" >> "$GITHUB_OUTPUT"
          echo "service_sg=$SERVICE_SG" >> "$GITHUB_OUTPUT"
          echo "subnet_a=${SUBNETS[0]}" >> "$GITHUB_OUTPUT"
          echo "subnet_b=${SUBNETS[1]}" >> "$GITHUB_OUTPUT"

      - name: Prepare CloudWatch log group
        run: |
          aws logs create-log-group --log-group-name /ecs/$SERVICE_NAME 2>/dev/null || true
          aws logs put-retention-policy --log-group-name /ecs/$SERVICE_NAME --retention-in-days 14

      - name: Create or update ECS Express Mode service
        id: express
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SECRET_ARN: ${{ steps.aws-resources.outputs.secret_arn }}
          SERVICE_SG: ${{ steps.aws-resources.outputs.service_sg }}
          SUBNET_A: ${{ steps.aws-resources.outputs.subnet_a }}
          SUBNET_B: ${{ steps.aws-resources.outputs.subnet_b }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          CLUSTER_NAME="$SERVICE_NAME"
          CLUSTER_ARN="$(aws ecs describe-clusters --clusters "$CLUSTER_NAME" --query 'clusters[0].clusterArn' --output text 2>/dev/null || true)"
          if [ -z "$CLUSTER_ARN" ] || [ "$CLUSTER_ARN" = "None" ]; then
            CLUSTER_ARN="$(aws ecs create-cluster --cluster-name "$CLUSTER_NAME" --query 'cluster.clusterArn' --output text)"
          fi
          aws iam create-service-linked-role --aws-service-name ecs.amazonaws.com 2>/dev/null || true
          EXEC_ROLE="arn:aws:iam::$ACCOUNT_ID:role/motordeck-ecs-task-execution"
          INFRA_ROLE="arn:aws:iam::$ACCOUNT_ID:role/motordeck-ecs-express-infra"
          SERVICE_ARN="$(aws ecs list-services --cluster "$CLUSTER_NAME" --query "serviceArns[?ends_with(@, '/$SERVICE_NAME')]" --output text || true)"
          if [ -n "$SERVICE_ARN" ] && [ "$SERVICE_ARN" != "None" ]; then
            APP_ORIGIN="https://$SERVICE_NAME.ecs.$AWS_REGION.on.aws"
            PRIMARY="$(jq -cn --arg image "$IMAGE" --arg origin "$APP_ORIGIN" --arg secret "$SECRET_ARN" '{image:$image,containerPort:3000,awsLogsConfiguration:{logGroup:("/ecs/"+env.SERVICE_NAME),logStreamPrefix:"ecs"},environment:[{name:"APP_ENV",value:"production"},{name:"APP_ORIGIN",value:$origin}],secrets:[{name:"DATABASE_URL",valueFrom:($secret+":DATABASE_URL::")},{name:"ADMIN_SETUP_TOKEN",valueFrom:($secret+":ADMIN_SETUP_TOKEN::")}]}' )"
            UPDATE_RESULT="$(aws ecs update-express-gateway-service --service-arn "$SERVICE_ARN" --primary-container "$PRIMARY")"
            ENDPOINT="$(jq -r '.service.targetConfiguration.ingressPaths[0].endpoint // empty' <<< "$UPDATE_RESULT")"
            if [ -n "$ENDPOINT" ] && [ "$ENDPOINT" != "None" ]; then
              PRIMARY="$(jq -cn --arg image "$IMAGE" --arg origin "$ENDPOINT" --arg secret "$SECRET_ARN" '{image:$image,containerPort:3000,awsLogsConfiguration:{logGroup:("/ecs/"+env.SERVICE_NAME),logStreamPrefix:"ecs"},environment:[{name:"APP_ENV",value:"production"},{name:"APP_ORIGIN",value:$origin}],secrets:[{name:"DATABASE_URL",valueFrom:($secret+":DATABASE_URL::")},{name:"ADMIN_SETUP_TOKEN",valueFrom:($secret+":ADMIN_SETUP_TOKEN::")}]}' )"
              aws ecs update-express-gateway-service --service-arn "$SERVICE_ARN" --primary-container "$PRIMARY" >/dev/null
            fi
          else
            APP_ORIGIN="https://$SERVICE_NAME.ecs.$AWS_REGION.on.aws"
            PRIMARY="$(jq -cn --arg image "$IMAGE" --arg origin "$APP_ORIGIN" --arg secret "$SECRET_ARN" '{image:$image,containerPort:3000,awsLogsConfiguration:{logGroup:("/ecs/"+env.SERVICE_NAME),logStreamPrefix:"ecs"},environment:[{name:"APP_ENV",value:"production"},{name:"APP_ORIGIN",value:$origin}],secrets:[{name:"DATABASE_URL",valueFrom:($secret+":DATABASE_URL::")},{name:"ADMIN_SETUP_TOKEN",valueFrom:($secret+":ADMIN_SETUP_TOKEN::")}]}' )"
            REQUEST="$(jq -cn --arg name "$SERVICE_NAME" --arg cluster "$CLUSTER_ARN" --arg exec "$EXEC_ROLE" --arg infra "$INFRA_ROLE" --argjson primary "$PRIMARY" --arg sg "$SERVICE_SG" --arg a "$SUBNET_A" --arg b "$SUBNET_B" '{serviceName:$name,cluster:$cluster,executionRoleArn:$exec,infrastructureRoleArn:$infra,healthCheckPath:"/api/health",primaryContainer:$primary,networkConfiguration:{securityGroups:[$sg],subnets:[$a,$b]},cpu:"512",memory:"1024",scalingTarget:{minTaskCount:1,maxTaskCount:2,autoScalingMetric:"AVERAGE_CPU",autoScalingTargetValue:60},tags:[{key:"Project",value:"MotorDeck"},{key:"ManagedBy",value:"GitHubActions"}]}')"
            CREATE_RESULT="$(aws ecs create-express-gateway-service --cli-input-json "$REQUEST")"
            SERVICE_ARN="$(jq -r '.service.serviceArn' <<< "$CREATE_RESULT")"
            ENDPOINT="$(jq -r '.service.targetConfiguration.ingressPaths[0].endpoint // empty' <<< "$CREATE_RESULT")"
            PRIMARY="$(jq -cn --arg image "$IMAGE" --arg origin "$ENDPOINT" --arg secret "$SECRET_ARN" '{image:$image,containerPort:3000,awsLogsConfiguration:{logGroup:("/ecs/"+env.SERVICE_NAME),logStreamPrefix:"ecs"},environment:[{name:"APP_ENV",value:"production"},{name:"APP_ORIGIN",value:$origin}],secrets:[{name:"DATABASE_URL",valueFrom:($secret+":DATABASE_URL::")},{name:"ADMIN_SETUP_TOKEN",valueFrom:($secret+":ADMIN_SETUP_TOKEN::")}]}' )"
            if [ -n "$ENDPOINT" ] && [ "$ENDPOINT" != "None" ]; then
              aws ecs update-express-gateway-service --service-arn "$SERVICE_ARN" --primary-container "$PRIMARY" >/dev/null
            fi
          fi
          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" = "None" ]; then
            echo "Não foi possível obter o ARN do serviço ECS Express." >&2
            exit 1
          fi
          if [ -z "$ENDPOINT" ] || [ "$ENDPOINT" = "None" ]; then
            echo "ECS não retornou o endpoint público do serviço." >&2
            exit 1
          fi
          echo "service_arn=$SERVICE_ARN" >> "$GITHUB_OUTPUT"
          echo "endpoint=$ENDPOINT" >> "$GITHUB_OUTPUT"

      - name: Verify public health endpoint
        env:
          SERVICE_ENDPOINT: ${{ steps.express.outputs.endpoint }}
        run: |
          set -euo pipefail
          URL="$SERVICE_ENDPOINT/api/health"
          for attempt in $(seq 1 5); do
            STATUS="$(curl --connect-timeout 5 --max-time 10 -L -sS -o /tmp/motordeck-health.json -w '%{http_code}' "$URL" || true)"
            if [ "$STATUS" = "200" ]; then
              cat /tmp/motordeck-health.json
              exit 0
            fi
            echo "Health check $attempt/5 retornou HTTP $STATUS; aguardando..."
            sleep 10
          done
          echo "Aplicação não respondeu 200 após 5 tentativas em $URL" >&2
          cat /tmp/motordeck-health.json 2>/dev/null || true
          exit 1

      - name: Show recent application logs if health check fails
        if: failure()
        env:
          SERVICE_ARN: ${{ steps.express.outputs.service_arn }}
        run: |
          set +e
          echo '--- ECS deployment monitor ---'
          timeout 90s aws ecs monitor-express-gateway-service --service-arn "$SERVICE_ARN" --resource-view DEPLOYMENT --timeout 60 || true
          echo '--- ECS service events ---'
          aws ecs describe-services --cluster "$SERVICE_NAME" --services "$SERVICE_NAME" --query 'services[0].events[:10].message' || true
          echo '--- ECS Express service ---'
          aws ecs describe-express-gateway-service --service-arn "$SERVICE_ARN" || true
          echo '--- CloudWatch streams ---'
          aws logs describe-log-streams --log-group-name "/ecs/$SERVICE_NAME" --order-by LastEventTime --descending --max-items 20 --query 'logStreams[*].{name:logStreamName,lastEvent:lastEventTimestamp,storedBytes:storedBytes}' || true
          echo '--- Recent application logs ---'
          START_MS="$(( ($(date +%s) - 900) * 1000 ))"
          aws logs filter-log-events --log-group-name "/ecs/$SERVICE_NAME" --start-time "$START_MS" --query 'events[*].{time:timestamp,message:message,stream:logStreamName}' --output json || true
